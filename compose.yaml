services:
  postgres:
    image: pgvector/pgvector:0.8.1-pg17
    environment:
      POSTGRES_DB: pydebugger
      POSTGRES_USER: pydebugger
      POSTGRES_PASSWORD: pydebugger
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pydebugger -d pydebugger"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - pydebugger-postgres:/var/lib/postgresql/data

volumes:
  pydebugger-postgres:
